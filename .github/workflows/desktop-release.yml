name: gymL Windows release

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.1

permissions:
  contents: read

concurrency:
  group: gyml-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - name: Test and build portable Windows package
        run: ./scripts/build-portable.ps1
      - name: Verify binary resources and package privacy
        run: ./scripts/verify-portable.ps1
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+(?:\.[0-9]+)?$') { throw 'Invalid release tag' }
          gh release view $env:RELEASE_TAG --json isDraft
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $env:RELEASE_TAG already exists; retaining its assets."
            exit 0
          }
          $assets = @('gymL.exe','dist/gymL-portable-windows-x64.zip','dist/gymL/THIRD_PARTY_LICENSES.txt','LICENSE')
          $lines = foreach ($path in $assets) {
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($path))"
          }
          [System.IO.File]::WriteAllLines((Join-Path $PWD 'dist/SHA256SUMS.txt'),$lines,[System.Text.UTF8Encoding]::new($false))
          gh release create $env:RELEASE_TAG @assets 'dist/SHA256SUMS.txt' --draft --target $env:RELEASE_COMMIT --title "gymL $env:RELEASE_TAG" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation or asset upload failed' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
