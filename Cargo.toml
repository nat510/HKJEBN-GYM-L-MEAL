[package]
name = "gyml"
version = "1.1.0"
license = "AGPL-3.0-or-later"
edition = "2024"
rust-version = "1.88"
build = "build.rs"

[[bin]]
name = "gymL"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = { version = "0.24", default-features = false }
regex = "1"
url = "2"
percent-encoding = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true
