<!DOCTYPE html>
<html>

        if(cookieEnabled){
            document.cookie = 'cookietest=1; expires=Thu, 01-Jan-1970 00:00:01 GMT';
            document.location.href = decodeURIComponent('%2F%3Fc%3Dhkjebn%26e%3Dhkjebnshare202002%26t%3Dhttps%253A%252F%252Fmp.hkjebn.com%252Fproduct.php%253Fcat%253D1408%2526subcat%253D1409%26cid%3Dzh-HK');

        }

        }
    </style>
</head>
